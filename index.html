<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zarobki miesięczne</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&display=swap');
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:#eaf0fb;padding:1.5rem;}
  .wrap{font-family:'Sora',sans-serif;padding:1.25rem 0;background:transparent;}
  .theme-bar{display:flex;justify-content:flex-end;margin-bottom:1.25rem;}
  .theme-toggle{display:flex;align-items:center;border-radius:30px;overflow:hidden;border:1.5px solid var(--tog-border);background:var(--tog-bg);padding:3px;}
  .tog-btn{font-family:'Sora',sans-serif;font-size:12px;font-weight:500;padding:5px 14px;border-radius:24px;border:none;cursor:pointer;transition:all 0.2s ease;background:transparent;color:var(--tog-off);}
  .tog-btn.active{background:var(--tog-active-bg);color:var(--tog-active-color);box-shadow:0 1px 4px rgba(0,0,0,0.15);}
  .light{
    --bg-glass:rgba(255,255,255,0.72);--bg-glass-border:rgba(255,255,255,0.85);
    --bg-glass-shadow:0 8px 32px rgba(31,38,135,0.10),inset 0 1px 0 rgba(255,255,255,0.9);
    --card-bg:rgba(255,255,255,0.80);--card-border:rgba(200,210,235,0.7);
    --card-shadow:0 2px 12px rgba(31,38,135,0.07),inset 0 1px 0 rgba(255,255,255,0.9);
    --lbl:#8590a8;--val:#1245a8;--sub:#c0cbe0;
    --tick:rgba(30,40,80,0.45);--grid:rgba(23,96,200,0.07);
    --line:#1760c8;--ptfill:#ffffff;
    --grad0:rgba(23,96,200,0.18);--grad1:rgba(23,96,200,0);
    --body-bg:linear-gradient(135deg,#dfe8f7 0%,#eaf0fb 50%,#d8e6f5 100%);
    --tog-bg:rgba(220,228,245,0.9);--tog-border:rgba(23,96,200,0.2);
    --tog-off:#8590a8;--tog-active-bg:#1760c8;--tog-active-color:#fff;
    --badge-bg:rgba(23,96,200,0.10);--badge-color:#1245a8;--badge-border:rgba(23,96,200,0.2);
    --title-color:#0e1a40;--sub-color:#6a7a9b;
    --ctrl-bg:rgba(23,96,200,0.08);--ctrl-color:#1245a8;--ctrl-border:rgba(23,96,200,0.22);
    --ctrl-active-bg:rgba(23,96,200,0.20);--ctrl-active-border:rgba(23,96,200,0.45);
    --fc-tag-bg:rgba(210,145,0,0.12);--fc-tag-color:#8a5c00;--fc-tag-border:rgba(210,145,0,0.28);
    --tip-bg:rgba(255,255,255,0.97);--tip-border:rgba(200,210,235,0.9);
    --tip-shadow:0 4px 24px rgba(31,38,135,0.15);--tip-color:#0e1a40;
    --tip-strong:#1245a8;--tip-muted:#a0aec0;
    --note-color:#7a8aaa;
  }
  .dark{
    --bg-glass:rgba(14,20,40,0.72);--bg-glass-border:rgba(255,255,255,0.10);
    --bg-glass-shadow:0 8px 40px rgba(0,0,0,0.45),inset 0 1px 0 rgba(255,255,255,0.06);
    --card-bg:rgba(22,30,58,0.80);--card-border:rgba(255,255,255,0.09);
    --card-shadow:0 2px 14px rgba(0,0,0,0.35),inset 0 1px 0 rgba(255,255,255,0.05);
    --lbl:rgba(180,195,230,0.40);--val:#7db4ff;--sub:rgba(180,195,230,0.24);
    --tick:rgba(180,200,240,0.45);--grid:rgba(255,255,255,0.06);
    --line:#6aaeff;--ptfill:#0e1a40;
    --grad0:rgba(100,160,255,0.22);--grad1:rgba(100,160,255,0);
    --body-bg:linear-gradient(135deg,#080d1e 0%,#0f1830 50%,#070c1c 100%);
    --tog-bg:rgba(255,255,255,0.07);--tog-border:rgba(255,255,255,0.14);
    --tog-off:rgba(180,200,240,0.45);--tog-active-bg:#2a5bba;--tog-active-color:#e8f0ff;
    --badge-bg:rgba(100,160,255,0.12);--badge-color:#7db4ff;--badge-border:rgba(100,160,255,0.22);
    --title-color:#d8e6ff;--sub-color:rgba(180,200,240,0.55);
    --ctrl-bg:rgba(100,160,255,0.07);--ctrl-color:#7db4ff;--ctrl-border:rgba(100,160,255,0.22);
    --ctrl-active-bg:rgba(100,160,255,0.20);--ctrl-active-border:rgba(100,160,255,0.45);
    --fc-tag-bg:rgba(255,200,80,0.10);--fc-tag-color:#e6c45a;--fc-tag-border:rgba(255,200,80,0.22);
    --tip-bg:rgba(12,18,38,0.97);--tip-border:rgba(255,255,255,0.12);
    --tip-shadow:0 4px 28px rgba(0,0,0,0.55);--tip-color:#d8e6ff;
    --tip-strong:#7db4ff;--tip-muted:rgba(180,200,240,0.38);
    --note-color:rgba(180,200,240,0.35);
  }
  .scene{background:var(--body-bg);border-radius:20px;padding:1.5rem;transition:all 0.3s ease;}
  .lg-header{text-align:center;margin-bottom:1.5rem;}
  .lg-title{font-size:21px;font-weight:700;color:var(--title-color);letter-spacing:-0.4px;transition:color 0.3s;}
  .lg-subtitle{font-size:13px;font-weight:400;color:var(--sub-color);margin-top:5px;transition:color 0.3s;}
  .lg-badge{display:inline-block;margin-top:9px;background:var(--badge-bg);color:var(--badge-color);border:0.5px solid var(--badge-border);border-radius:20px;font-size:11px;font-weight:600;padding:3px 12px;letter-spacing:0.4px;}
  .lg-chart-glass{position:relative;border-radius:18px;background:var(--bg-glass);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);border:1px solid var(--bg-glass-border);box-shadow:var(--bg-glass-shadow);padding:1.25rem 1.25rem 1rem;margin-bottom:1rem;transition:all 0.3s;}
  .controls{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:1rem;}
  .ctrl-btn{font-family:'Sora',sans-serif;font-size:12px;font-weight:500;padding:5px 14px;border-radius:20px;border:0.5px solid var(--ctrl-border);background:var(--ctrl-bg);color:var(--ctrl-color);cursor:pointer;transition:all 0.15s ease;}
  .ctrl-btn.active,.ctrl-btn:hover{background:var(--ctrl-active-bg);border-color:var(--ctrl-active-border);}
  .years-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:10px;margin-top:0.75rem;}
  .year-card{background:var(--card-bg);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--card-border);box-shadow:var(--card-shadow);border-radius:14px;padding:13px 14px;text-align:center;transition:all 0.3s;}
  .yc-label{font-size:11px;font-weight:600;color:var(--lbl);margin-bottom:5px;text-transform:uppercase;letter-spacing:0.7px;}
  .yc-val{font-size:16px;font-weight:700;color:var(--val);}
  .yc-sub{font-size:11px;color:var(--sub);margin-top:3px;font-weight:400;}
  .forecast-tag{display:inline-block;font-size:10px;font-weight:600;background:var(--fc-tag-bg);color:var(--fc-tag-color);border:0.5px solid var(--fc-tag-border);border-radius:10px;padding:1px 7px;margin-left:4px;vertical-align:middle;}
  .rate-note{font-size:11px;color:var(--note-color);text-align:right;margin-top:6px;font-style:italic;}
  .tooltip-glass{position:fixed;pointer-events:none;background:var(--tip-bg);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--tip-border);box-shadow:var(--tip-shadow);border-radius:13px;padding:11px 15px;font-family:'Sora',sans-serif;font-size:13px;color:var(--tip-color);display:none;z-index:9999;min-width:200px;}
  .tooltip-glass strong{font-weight:700;font-size:15px;color:var(--tip-strong);display:block;margin-top:3px;}
  .tip-muted{font-size:11px;color:var(--tip-muted);margin-top:2px;display:block;}
  .tip-rate{font-size:10px;color:var(--tip-muted);margin-top:1px;display:block;}
</style>
</head>
<body>
<div class="wrap light" id="app">
  <div class="theme-bar">
    <div class="theme-toggle">
      <button class="tog-btn active" id="btnLight" onclick="setTheme('light')">&#9728; Jasny</button>
      <button class="tog-btn" id="btnDark" onclick="setTheme('dark')">&#9679; Ciemny</button>
    </div>
  </div>
  <div class="scene">
    <div class="lg-header">
      <div class="lg-title">Zarobki miesi&#281;czne</div>
      <div class="lg-subtitle">Warto&#347;ci w PLN netto &middot; EUR przeliczony wg przybli&#380;onych kurs&oacute;w historycznych NBP</div>
      <span class="lg-badge">Tylko warto&#347;&#263; NETTO</span>
    </div>
    <div class="lg-chart-glass">
      <div class="controls" id="yearBtns"></div>
      <div style="position:relative;width:100%;height:340px;">
        <canvas id="earningsChart" role="img" aria-label="Wykres zarobk&oacute;w netto PLN 2021-2027">Zarobki netto w PLN od 2021 do 2027.</canvas>
      </div>
      <div class="rate-note" id="rateNote"></div>
    </div>
    <div class="years-grid" id="yearSummary"></div>
  </div>
</div>
<div class="tooltip-glass" id="tooltip"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
// Przyblizony sredni kurs EUR/PLN NBP wg miesiecy (zrodlo: dane historyczne NBP)
// 2021: srednia roczna ~4.57, wahania 4.45-4.72
// 2022: srednia roczna ~4.69, wahania 4.49-4.96
// 2023: srednia roczna ~4.54, wahania 4.27-4.73
// 2024: srednia roczna ~4.26, wahania 4.19-4.35
// 2025: srednia roczna ~4.25, wahania 4.20-4.30
const EUR_RATES = {
  '2021-01':4.55,'2021-02':4.52,'2021-03':4.62,'2021-04':4.56,
  '2021-05':4.53,'2021-06':4.51,'2021-07':4.57,'2021-08':4.57,
  '2021-09':4.59,'2021-10':4.60,'2021-11':4.65,'2021-12':4.63,
  '2022-01':4.55,'2022-02':4.57,'2022-03':4.72,'2022-04':4.67,
  '2022-05':4.62,'2022-06':4.68,'2022-07':4.74,'2022-08':4.74,
  '2022-09':4.79,'2022-10':4.83,'2022-11':4.70,'2022-12':4.68,
  '2023-01':4.71,'2023-02':4.73,'2023-03':4.67,'2023-04':4.63,
  '2023-05':4.52,'2023-06':4.45,'2023-07':4.42,'2023-08':4.43,
  '2023-09':4.38,'2023-10':4.39,'2023-11':4.37,'2023-12':4.32,
  '2024-01':4.35,'2024-02':4.31,'2024-03':4.30,'2024-04':4.29,
  '2024-05':4.27,'2024-06':4.26,'2024-07':4.28,'2024-08':4.27,
  '2024-09':4.27,'2024-10':4.31,'2024-11':4.31,'2024-12':4.27,
  '2025-01':4.27,'2025-02':4.19,'2025-03':4.20,'2025-04':4.21,
  '2025-05':4.22,'2025-06':4.22,'2025-07':4.23,'2025-08':4.24,
  '2025-09':4.25,'2025-10':4.26,'2025-11':4.26,'2025-12':4.27,
};

function getRate(d){ return EUR_RATES[d] || 4.25; }

// Dane zrodlowe (EUR = wartosc w EUR, PLN = juz w PLN)
const rawRows = [
  // 2021 - Klient A (PLN)
  {d:'2021-01',eur:0,pln:18050},{d:'2021-02',eur:0,pln:19000},{d:'2021-03',eur:0,pln:21850},
  {d:'2021-04',eur:0,pln:19950},{d:'2021-05',eur:0,pln:19000},{d:'2021-06',eur:0,pln:19950},
  {d:'2021-08',eur:0,pln:10450},
  // 2021-10: Klient A (PLN) + Klient B (EUR tygodniowo)
  {d:'2021-10',eur:1800+1800+1800,pln:19950},
  // 2021-11: Klient B tygodniowo EUR
  {d:'2021-11',eur:1800+1440+360+1800+1800,pln:0},
  // 2021-12: Klient B tygodniowo EUR
  {d:'2021-12',eur:1800+1800+1800+1800,pln:0},
  // 2022 - Klient B (EUR tygodniowo)
  {d:'2022-01',eur:1440+1800+1800+1800+1800,pln:0},
  {d:'2022-02',eur:1800*4,pln:0},
  {d:'2022-03',eur:1800*4,pln:0},
  {d:'2022-04',eur:1800+1800+1800+1440,pln:0},
  {d:'2022-05',eur:1800+1800,pln:0},
  // 2022 - Klient C (EUR miesieczne)
  {d:'2022-08',eur:7920,pln:0},
  {d:'2022-09',eur:7920,pln:0},
  {d:'2022-10',eur:6840,pln:0},
  {d:'2022-11',eur:7200,pln:0},
  {d:'2022-12',eur:5400,pln:0},
  // 2023 - Klient D (EUR miesieczne)
  {d:'2023-02',eur:6285,pln:0},{d:'2023-03',eur:6285,pln:0},
  {d:'2023-04',eur:6285,pln:0},{d:'2023-05',eur:6285,pln:0},
  {d:'2023-06',eur:6285,pln:0},{d:'2023-07',eur:6285,pln:0},
  {d:'2023-08',eur:6285,pln:0},{d:'2023-09',eur:6285,pln:0},
  {d:'2023-10',eur:6285,pln:0},{d:'2023-11',eur:6285,pln:0},{d:'2023-12',eur:6285,pln:0},
  // 2024 - Klient D
  {d:'2024-01',eur:6285,pln:0},{d:'2024-02',eur:6285,pln:0},
  {d:'2024-03',eur:6285,pln:0},{d:'2024-04',eur:6285,pln:0},
  {d:'2024-05',eur:6285,pln:0},
  {d:'2024-06',eur:6285,pln:2000}, // + Klient E PLN 2000
  {d:'2024-07',eur:6285,pln:0},{d:'2024-08',eur:6285,pln:0},
  {d:'2024-09',eur:6285,pln:0},{d:'2024-10',eur:6285,pln:0},
  {d:'2024-11',eur:6285,pln:0},{d:'2024-12',eur:6285,pln:0},
  // 2025 - Klient D
  {d:'2025-01',eur:6285,pln:0},{d:'2025-02',eur:6285,pln:0},
  {d:'2025-03',eur:6285,pln:0},{d:'2025-04',eur:6285,pln:0},
  {d:'2025-05',eur:6285,pln:0},{d:'2025-06',eur:6285,pln:0},
  {d:'2025-07',eur:6285,pln:0},{d:'2025-08',eur:6285,pln:0},
  {d:'2025-09',eur:6285,pln:0},{d:'2025-10',eur:6285,pln:0},
  {d:'2025-11',eur:6285,pln:0},{d:'2025-12',eur:6285,pln:0},
  // 2026 - Klient D (historyczne Jan-Mar) + prognoza
  {d:'2026-01',eur:6285,pln:0},{d:'2026-02',eur:6285,pln:0},{d:'2026-03',eur:6285,pln:0},
  {d:'2026-04',eur:0,pln:8000,fc:true},
  {d:'2026-05',eur:0,pln:16000,fc:true},
  {d:'2026-06',eur:0,pln:16000,fc:true},
  {d:'2026-07',eur:0,pln:16000,fc:true},
  {d:'2026-08',eur:0,pln:18400,fc:true},
  {d:'2026-09',eur:0,pln:18400,fc:true},
  {d:'2026-10',eur:0,pln:18400,fc:true},
  {d:'2026-11',eur:0,pln:18400,fc:true},
  {d:'2026-12',eur:0,pln:18400,fc:true},
  // 2027 - prognoza
  {d:'2027-01',eur:0,pln:18400,fc:true},{d:'2027-02',eur:0,pln:18400,fc:true},
  {d:'2027-03',eur:0,pln:18400,fc:true},{d:'2027-04',eur:0,pln:18400,fc:true},
  {d:'2027-05',eur:0,pln:18400,fc:true},{d:'2027-06',eur:0,pln:18400,fc:true},
  {d:'2027-07',eur:0,pln:18400,fc:true},{d:'2027-08',eur:0,pln:18400,fc:true},
  {d:'2027-09',eur:0,pln:18400,fc:true},{d:'2027-10',eur:0,pln:18400,fc:true},
  {d:'2027-11',eur:0,pln:18400,fc:true},{d:'2027-12',eur:0,pln:18400,fc:true},
];

// Agreguj do miesiaca
const mMap={}, fcSet=new Set(), rateMap={}, eurMap={};
rawRows.forEach(r=>{
  const rate = getRate(r.d);
  const val = Math.round(r.eur * rate + r.pln);
  mMap[r.d] = (mMap[r.d]||0) + val;
  if(r.fc) fcSet.add(r.d);
  if(r.eur>0){ rateMap[r.d]=rate; eurMap[r.d]=(eurMap[r.d]||0)+r.eur; }
});

const allKeys=Object.keys(mMap).sort();
const allVals=allKeys.map(k=>Math.round(mMap[k]));
const years=[...new Set(allKeys.map(k=>k.slice(0,4)))];
const MN=['Sty','Lut','Mar','Kwi','Maj','Cze','Lip','Sie','Wrz','Pa\u017a','Lis','Gru'];
const lbl=k=>{const[y,m]=k.split('-');return MN[+m-1]+' '+y;};
const fmt=v=>new Intl.NumberFormat('pl-PL',{style:'currency',currency:'PLN',maximumFractionDigits:0}).format(Math.round(v));
const cpct=v=>new Intl.NumberFormat('pl-PL',{notation:'compact',maximumFractionDigits:0}).format(v)+' z\u0142';

let chart, activeYear='all';

function getCSSVar(n){return getComputedStyle(document.getElementById('app')).getPropertyValue(n).trim();}
function getColors(){return{line:getCSSVar('--line'),ptfill:getCSSVar('--ptfill'),grid:getCSSVar('--grid'),tick:getCSSVar('--tick'),grad0:getCSSVar('--grad0'),grad1:getCSSVar('--grad1')};}

function buildRateNote(year){
  const note = document.getElementById('rateNote');
  if(year==='all'){
    note.textContent='Kursy historyczne NBP: 2021 \u2248 4,55\u20134,65 \u2022 2022 \u2248 4,55\u20134,83 \u2022 2023 \u2248 4,32\u20134,73 \u2022 2024 \u2248 4,26\u20134,35 \u2022 2025 \u2248 4,19\u20134,27';
  } else {
    const rates = allKeys.filter(k=>k.startsWith(year)&&rateMap[k]).map(k=>rateMap[k]);
    if(rates.length){
      const mn=Math.min(...rates).toFixed(2), mx=Math.max(...rates).toFixed(2);
      note.textContent='Kursy EUR/PLN NBP w '+year+': min '+mn.replace('.',',')+' \u2014 max '+mx.replace('.',',')+' z\u0142';
    } else {
      note.textContent='Warto\u015bci w PLN \u2014 przeliczenie EUR nie dotyczy';
    }
  }
}

function buildChart(year){
  let keys,vals;
  if(year==='all'){keys=allKeys;vals=allVals;}
  else{keys=allKeys.filter(k=>k.startsWith(year));vals=keys.map(k=>Math.round(mMap[k]));}
  const labs=keys.map(lbl);
  const fcStart=keys.findIndex(k=>fcSet.has(k));
  const C=getColors();
  const ctx=document.getElementById('earningsChart').getContext('2d');
  const grad=ctx.createLinearGradient(0,0,0,320);
  grad.addColorStop(0,C.grad0);grad.addColorStop(1,C.grad1);
  if(chart)chart.destroy();
  chart=new Chart(ctx,{
    type:'line',
    data:{labels:labs,datasets:[{
      label:'Zarobki netto',data:vals,
      borderColor:C.line,backgroundColor:grad,borderWidth:2.5,fill:true,tension:0.38,
      pointBackgroundColor:vals.map((_,i)=>(fcStart!==-1&&i>=fcStart)?'#3a2a00':C.ptfill),
      pointBorderColor:vals.map((_,i)=>(fcStart!==-1&&i>=fcStart)?'#e6a817':C.line),
      pointBorderWidth:2,pointRadius:5,pointHoverRadius:7,
      segment:{
        borderDash:c=>(fcStart!==-1&&c.p0DataIndex>=fcStart-1)?[6,4]:[],
        borderColor:c=>(fcStart!==-1&&c.p0DataIndex>=fcStart-1)?'#e6a817':C.line,
      }
    }]},
    options:{
      responsive:true,maintainAspectRatio:false,
      interaction:{mode:'index',intersect:false},
      plugins:{
        legend:{display:false},
        tooltip:{enabled:false,external:function(ctx2){
          const tip=document.getElementById('tooltip');
          if(ctx2.tooltip.opacity===0){tip.style.display='none';return;}
          const dp=ctx2.tooltip.dataPoints[0];
          const ki=keys[dp.dataIndex];
          const isFc=fcStart!==-1&&dp.dataIndex>=fcStart;
          const hasEur=eurMap[ki];
          let rateStr='';
          if(hasEur&&rateMap[ki]) rateStr='<span class="tip-rate">EUR '+eurMap[ki]+' &times; '+rateMap[ki].toFixed(2).replace('.',',')+'</span>';
          tip.innerHTML='<span style="font-size:12px;color:var(--tip-muted)">'+dp.label+'</span><strong>'+fmt(dp.raw)+'</strong>'+rateStr+'<span class="tip-muted">Warto\u015b\u0107 netto'+(isFc?' &middot; Prognoza':'')+'</span>';
          const r=ctx2.chart.canvas.getBoundingClientRect();
          let x=r.left+ctx2.tooltip.caretX+14,y=r.top+ctx2.tooltip.caretY-22;
          if(x+220>window.innerWidth)x=r.left+ctx2.tooltip.caretX-225;
          tip.style.left=x+'px';tip.style.top=y+'px';tip.style.display='block';
        }}
      },
      scales:{
        x:{grid:{color:C.grid,lineWidth:0.5},ticks:{color:C.tick,font:{family:'Sora',size:11},maxRotation:45,autoSkip:true,maxTicksLimit:year==='all'?22:12},border:{display:false}},
        y:{grid:{color:C.grid,lineWidth:0.5},ticks:{color:C.tick,font:{family:'Sora',size:11},callback:v=>cpct(v)},border:{display:false}}
      }
    }
  });
  buildRateNote(year);
}

function buildYearBtns(){
  const c=document.getElementById('yearBtns');c.innerHTML='';
  ['all',...years].forEach(y=>{
    const b=document.createElement('button');
    b.className='ctrl-btn'+(y===activeYear?' active':'');
    b.textContent=y==='all'?'Wszystkie lata':y;
    b.onclick=()=>{activeYear=y;buildYearBtns();buildChart(y);};
    c.appendChild(b);
  });
}

function buildYearSummary(){
  const c=document.getElementById('yearSummary');c.innerHTML='';
  years.forEach(y=>{
    const ks=allKeys.filter(k=>k.startsWith(y));
    const total=ks.reduce((s,k)=>s+mMap[k],0);
    const avg=total/ks.length;
    const isFc=ks.some(k=>fcSet.has(k));
    const avgRate=ks.filter(k=>rateMap[k]).map(k=>rateMap[k]);
    const rateInfo=avgRate.length?(avgRate.reduce((a,b)=>a+b,0)/avgRate.length).toFixed(2).replace('.',','):'—';
    const div=document.createElement('div');div.className='year-card';
    div.innerHTML=
      '<div class="yc-label">'+y+(isFc?'<span class="forecast-tag">prognoza</span>':'')+'</div>'+
      '<div class="yc-val">'+fmt(total)+'</div>'+
      '<div class="yc-sub">\u015br. '+fmt(avg)+'/mies.</div>'+
      (avgRate.length?'<div class="yc-sub" style="margin-top:4px;font-size:10px;">kurs \u2248 '+rateInfo+' z\u0142</div>':'');
    c.appendChild(div);
  });
}

function setTheme(t){
  const app=document.getElementById('app');
  app.classList.remove('light','dark');app.classList.add(t);
  document.getElementById('btnLight').classList.toggle('active',t==='light');
  document.getElementById('btnDark').classList.toggle('active',t==='dark');
  document.body.style.background=t==='dark'?'#080d1e':'#eaf0fb';
  setTimeout(()=>buildChart(activeYear),50);
}

buildYearBtns();
buildYearSummary();
buildChart('all');
</script>
</body>
</html>
